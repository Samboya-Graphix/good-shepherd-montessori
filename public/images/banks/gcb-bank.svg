<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- GCB Bank Badge Background -->
  <rect width="320" height="80" rx="12" fill="#FFFFFF"/>
  
  <!-- GCB Emblem / Icon Mark -->
  <g transform="translate(14, 12)">
    <!-- Yellow / Gold Rounded Square -->
    <rect width="56" height="56" rx="12" fill="#F7A800"/>
    <!-- Black Stylized Eagle / Wings Mark -->
    <path d="M28 10 C34 16 44 20 48 28 C42 27 36 29 28 36 C20 29 14 27 8 28 C12 20 22 16 28 10 Z" fill="#000000"/>
    <path d="M28 26 C32 30 38 33 42 39 C37 38 33 40 28 46 C23 40 19 38 14 39 C18 33 24 30 28 26 Z" fill="#000000"/>
    <circle cx="28" cy="22" r="3" fill="#F7A800"/>
  </g>

  <!-- Typography: GCB BANK -->
  <text x="82" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#000000" letter-spacing="-0.5">GCB</text>
  <text x="145" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#F7A800">BANK</text>
  
  <!-- Tagline / Slogan -->
  <text x="84" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#555555" letter-spacing="0.5">Your Bank for Life • Ghana</text>
</svg>
