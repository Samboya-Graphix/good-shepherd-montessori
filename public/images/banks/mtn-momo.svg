<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- MTN MoMo Badge Background -->
  <rect width="320" height="80" rx="12" fill="#FFFFFF"/>
  
  <!-- MTN Icon Emblem -->
  <g transform="translate(14, 12)">
    <rect width="56" height="56" rx="12" fill="#FFCC00"/>
    <!-- Oval Shape -->
    <ellipse cx="28" cy="28" rx="23" ry="15" fill="none" stroke="#000000" stroke-width="3.5"/>
    <!-- MTN Text -->
    <text x="28" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#000000" text-anchor="middle" font-style="italic" letter-spacing="-0.5">MTN</text>
  </g>

  <!-- Typography: MoMo & Mobile Money -->
  <text x="82" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#005B82" letter-spacing="-0.5">MoMo</text>
  <rect x="156" y="22" width="68" height="22" rx="6" fill="#FFCC00"/>
  <text x="190" y="37" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#000000" text-anchor="middle">PAY</text>
  
  <!-- Subtitle -->
  <text x="84" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#666666" letter-spacing="0.5">MTN Mobile Money • Dial *170#</text>
</svg>
